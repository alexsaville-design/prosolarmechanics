name: Sync Substack RSS

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Substack sync
        run: node scripts/sync-substack.js

      - name: Commit and push new posts
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add src/content/log/
          git diff --staged --quiet || git commit -m "sync: new Substack post(s)" && git push
